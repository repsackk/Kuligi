<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel organizatora — Kuligi Pod Tatrami</title><link rel="stylesheet" href="/style.css"><style>body{padding:35px;max-width:1300px;margin:auto}h1{font-size:38px}input{padding:12px;border:1px solid #ccc}table{width:100%;border-collapse:collapse;background:white;margin-top:30px;font-size:12px}td,th{padding:13px;border-bottom:1px solid #ddd;text-align:left}select{padding:8px}#status{margin:20px 0}main{overflow-x:auto}</style></head><body><a href="/">← Powrót na stronę</a><h1>Panel organizatora</h1><p>Wpisz hasło ustawione w <code>ADMIN_PASSWORD</code> w pliku .env. Panel jest demonstracyjny — przed produkcją wymaga pełnego uwierzytelniania i ograniczania prób logowania.</p><input id="password" type="password" placeholder="Hasło administratora"><button id="load" class="btn btn-dark">Pobierz rezerwacje</button><div id="status"></div><main><table><thead><tr><th>ID</th><th>Termin</th><th>Pakiet</th><th>Goście</th><th>Klient</th><th>Kontakt</th><th>Kwota</th><th>Status</th><th>Akcja</th></tr></thead><tbody id="rows"></tbody></table></main><script>const rows=document.querySelector('#rows'),status=document.querySelector('#status');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/admin/bookings',{headers:{'x-admin-password':document.querySelector('#password').value}});const data=await r.json();if(!r.ok){status.textContent=data.error||'Błąd';return}status.textContent='Liczba zgłoszeń: '+data.length;rows.innerHTML=data.map(b=>`<tr><td>${esc(b.id.slice(0,8))}</td><td>${esc(b.date)} ${esc(b.time)}</td><td>${esc(b.packageId)}</td><td>${esc(b.people)}</td><td>${esc(b.name)}</td><td>${esc(b.email)}<br>${esc(b.phone)}</td><td>${esc(b.amount)} zł</td><td>${esc(b.status)}</td><td><select data-id="${esc(b.id)}"><option value="">Zmień status</option><option value="confirmed">Potwierdź</option><option value="cancelled">Anuluj</option><option value="inquiry">Zapytanie</option></select></td></tr>`).join('');rows.querySelectorAll('select').forEach(s=>s.onchange=async()=>{if(!s.value)return;const r=await fetch('/api/admin/bookings/'+s.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-password':document.querySelector('#password').value},body:JSON.stringify({status:s.value})});if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.error||'Błąd aktualizacji')}load()})}document.querySelector('#load').onclick=load;</script></body></html>
