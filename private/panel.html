<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Rezerwacje · Kuligi Pod Tatrami</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f4f1e9;background:#0d1915}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.top{background:#14251e;border-bottom:1px solid #304239;padding:18px max(20px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{color:#d8bd87;font-weight:800;letter-spacing:.09em;font-size:13px}.shell{max-width:1160px;margin:0 auto;padding:30px 20px 70px}.eyebrow{color:#d8bd87;font-size:12px;letter-spacing:.15em;text-transform:uppercase}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}h1{font-size:clamp(27px,4vw,42px);margin:8px 0}p{line-height:1.5}.muted{color:#a9b6ac}.btn{border:1px solid #617669;border-radius:10px;padding:10px 14px;background:#24382e;color:#f5f1e8;font-weight:650}.btn:hover{background:#355041}.btn.gold{background:#d6b77c;border-color:#d6b77c;color:#14221a}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0 28px}.stat,.booking,.empty,.filters{background:#182b22;border:1px solid #32483a;border-radius:16px}.stat{padding:20px}.stat strong{font-size:clamp(22px,3vw,32px);display:block;color:#e5c88e;margin-top:10px}.stat small{color:#b6c4b8}.filters{padding:15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.filters label{font-size:13px;color:#b9c6bd}.filters input{background:#f6f3eb;border:0;border-radius:8px;padding:10px;color:#16251c}.filters .count{margin-left:auto;color:#c8d4ca;font-size:13px}.list{display:grid;gap:16px}.booking{padding:22px}.booking-head{display:flex;align-items:start;justify-content:space-between;gap:12px;flex-wrap:wrap}.date{font-size:clamp(21px,3vw,27px);font-weight:800}.pack{margin-top:7px;color:#e6c78e;font-weight:650}.pill{background:#234734;color:#a9e6b7;border:1px solid #3e7552;padding:7px 11px;border-radius:100px;font-size:12px;font-weight:700}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:13px;color:#c7d4c9}.divider{height:1px;background:#344c3c;margin:20px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}.fieldtitle{font-size:11px;letter-spacing:.12em;color:#b6c5b8;text-transform:uppercase;margin-bottom:8px}.contact{font-size:17px;font-weight:750}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{color:#e8cf9d;text-decoration:none;border:1px solid #536d5a;border-radius:9px;padding:8px 10px;font-size:13px}.notes{margin-top:16px;padding:14px;border-radius:10px;background:#25382e;color:#f4f0e8;white-space:pre-wrap;overflow-wrap:anywhere}.money{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}.money>div{flex:1;min-width:150px}.money strong{display:block;font-size:20px;margin-top:5px}.internal{margin-top:17px}.internal summary{cursor:pointer;color:#d9c293;font-weight:650}.internal textarea{display:block;width:100%;min-height:80px;margin:12px 0;padding:12px;border-radius:9px;border:1px solid #82988a;background:#f6f3eb;color:#17261d}.empty{text-align:center;padding:55px 18px;color:#c7d5ca}.error{color:#ffb8b8}.login{max-width:430px;margin:12vh auto;background:#182b22;padding:28px;border:1px solid #405744;border-radius:16px}.login input{width:100%;padding:13px;margin:12px 0;border:0;border-radius:9px}.login button{width:100%}#app{display:none}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.cols{grid-template-columns:1fr}.booking{padding:17px}.top{padding:16px}.filters .count{margin-left:0}}
</style></head><body><header class="top"><div class="brand">✦ KULIGI POD TATRAMI <span class="muted">/ ORGANIZATOR</span></div><button class="btn" id="logout" hidden>Wyloguj</button></header>
<section class="login" id="login"><div class="eyebrow">Dostęp prywatny</div><h1>Logowanie</h1><p class="muted">Panel potwierdzonych rezerwacji.</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Hasło administratora" required><button class="btn gold">Zaloguj</button></form><p id="loginMsg" class="error" role="alert"></p></section>
<main class="shell" id="app"><div class="intro"><div><div class="eyebrow">Płatności potwierdzone</div><h1>Nadchodzące kuligi</h1><div class="muted">Tylko rezerwacje z opłaconą zaliczką 50% — bez pustych terminów.</div></div><button id="refresh" class="btn">↻ Odśwież</button></div><div class="stats"><div class="stat"><small>Potwierdzone kuligi</small><strong id="trips">0</strong></div><div class="stat"><small>Łącznie uczestników</small><strong id="guests">0</strong></div><div class="stat"><small>Do pobrania na miejscu</small><strong id="due">0 zł</strong></div></div><div class="filters"><label for="date">Filtruj według dnia</label><input id="date" type="date"><button id="clear" class="btn">Wszystkie nadchodzące</button><span class="count" id="count"></span></div><div id="message" class="muted" role="status"></div><div class="list" id="bookings"></div></main>
<script>
let csrf='', all=[];const $=s=>document.querySelector(s),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pl-PL',{style:'currency',currency:'PLN'});const packages={classic:'Kulig tradycyjny',feast:'Kulig z biesiadą',private:'Kulig premium na wyłączność',romantic:'Kulig romantyczny'};
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,...opts.headers}});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.error||'Błąd serwera ('+r.status+')');return d}
function render(){const date=$('#date').value;const data=all.filter(b=>!date||b.date===date);$('#count').textContent=data.length+' rezerwacji';$('#bookings').innerHTML=data.length?data.map(b=>{const tel=String(b.phone||'').replace(/[^+0-9]/g,'');const mail=encodeURIComponent(b.email||'');const id=escapeHTML(b.id);const notes=String(b.notes||'').trim();return `<article class="booking"><div class="booking-head"><div><div class="date">${escapeHTML(b.date)} · ${escapeHTML(String(b.time||'').slice(0,5))}</div><div class="pack">${escapeHTML(packages[b.packageId]||b.packageId)}</div><div class="meta"><span>👥 ${Number(b.people)||0} osób</span><span>Rezerwacja #${id.slice(0,8)}</span></div></div><span class="pill">✓ Zaliczka opłacona</span></div><div class="divider"></div><div class="cols"><div><div class="fieldtitle">Osoba rezerwująca</div><div class="contact">${escapeHTML(b.name)}</div><div class="muted">${escapeHTML(b.phone)}<br>${escapeHTML(b.email)}</div><div class="links"><a href="tel:${tel}">Zadzwoń</a><a href="mailto:${mail}">Napisz e-mail</a></div></div><div><div class="fieldtitle">Uwagi klienta</div><div class="notes">${notes?escapeHTML(notes):'Brak dodatkowych uwag'}</div></div></div><div class="divider"></div><div class="money"><div><div class="fieldtitle">Cena całego kuligu</div><strong>${money(b.amount)}</strong></div><div><div class="fieldtitle">Zaliczka 50% — opłacona</div><strong>${money(b.depositAmount)}</strong></div><div><div class="fieldtitle">Do odbioru na miejscu</div><strong>${money(Number(b.amount)-Number(b.depositAmount))}</strong></div></div><details class="internal"><summary>Notatka organizatora</summary><textarea data-note="${id}" maxlength="2000" placeholder="Wewnętrzne informacje dotyczące tej rezerwacji">${escapeHTML(b.internal_notes)}</textarea><button class="btn" data-save="${id}">Zapisz notatkę</button></details></article>`}).join(''):'<div class="empty">Brak opłaconych rezerwacji w wybranym okresie.</div>'}
async function refresh(){try{$('#message').textContent='Pobieranie rezerwacji…';const data=await api('/api/admin/bookings');all=data.filter(b=>b.status==='confirmed');$('#trips').textContent=all.length;$('#guests').textContent=all.reduce((s,b)=>s+Number(b.people||0),0);$('#due').textContent=money(all.reduce((s,b)=>s+Number(b.amount||0)-Number(b.depositAmount||0),0));$('#message').textContent='Ostatnia aktualizacja: '+new Date().toLocaleTimeString('pl-PL');render()}catch(e){$('#message').textContent='Nie udało się pobrać rezerwacji: '+e.message;$('#message').classList.add('error')}}
function show(){$('#login').style.display='none';$('#app').style.display='block';$('#logout').hidden=false;refresh()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});csrf=r.csrf;$('#password').value='';show()}catch(err){$('#loginMsg').textContent=err.message}};
$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};$('#refresh').onclick=refresh;$('#date').onchange=render;$('#clear').onclick=()=>{$('#date').value='';render()};document.addEventListener('click',async e=>{const btn=e.target.closest('[data-save]');if(!btn)return;const note=[...document.querySelectorAll('[data-note]')].find(x=>x.dataset.note===btn.dataset.save);if(!note)return;try{await api('/api/admin/bookings/'+encodeURIComponent(btn.dataset.save)+'/notes',{method:'PATCH',body:JSON.stringify({internalNotes:note.value})});btn.textContent='Zapisano ✓';setTimeout(()=>btn.textContent='Zapisz notatkę',1800)}catch(err){alert(err.message)}});api('/api/admin/session').then(r=>{csrf=r.csrf;show()}).catch(()=>{});setInterval(()=>{if($('#app').style.display==='block'&&!document.hidden)refresh()},60000);
</script></body></html>
